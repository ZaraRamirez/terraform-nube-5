name: AWS auth
description: Autentica en AWS con OIDC (si hay role-arn) o con credenciales de acceso (AWS Academy).

inputs:
  region:
    description: Region de AWS
    required: true
  role-arn:
    description: ARN del rol para OIDC (secret AWS_ROLE_ARN). Vacio = usar llaves.
    required: false
    default: ""
  access-key-id:
    required: false
    default: ""
  secret-access-key:
    required: false
    default: ""
  session-token:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Credenciales por OIDC
      if: ${{ inputs.role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}

    - name: Credenciales por llaves de acceso
      if: ${{ inputs.role-arn == '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-session-token: ${{ inputs.session-token }}
        aws-region: ${{ inputs.region }}
