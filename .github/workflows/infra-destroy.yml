name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir DESTROY para destruir toda la infraestructura'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmacion
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "::error::La confirmacion debe ser exactamente DESTROY"
            exit 1
          fi

  destroy:
    needs: confirm
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=crm/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: destroy
        run: terraform destroy -auto-approve -input=false -var-file=env/prod.tfvars
