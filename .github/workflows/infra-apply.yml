name: infra-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # requiere aprobacion manual (Settings > Environments)
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/aws-auth
        with:
          region: ${{ vars.AWS_REGION }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=crm/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: validate
        run: terraform validate

      - name: apply
        run: terraform apply -auto-approve -input=false -var-file=env/prod.tfvars

      - name: Publicar outputs
        run: |
          {
            echo "## Outputs de Terraform"
            echo
            echo '| Output | Valor |'
            echo '|---|---|'
            terraform output -json | jq -r 'to_entries[] | "| `\(.key)` | \(.value.value) |"'
          } >> "$GITHUB_STEP_SUMMARY"
